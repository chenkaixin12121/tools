# 推送到 main 分支后自动发布到 GitHub Pages。
# 纯静态项目，无需构建步骤，直接把仓库根目录整体作为产物上传。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署。
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读代码、写 Pages、签发部署身份令牌。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署在跑；新的推送不取消进行中的部署，避免线上处于半发布状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          # "." 表示上传仓库根目录，index.html 正好在根目录。
          path: .

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
